<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODR - Menu Principal</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/personagens.css">
    <!-- Fontes Medievais -->
    <link href="https://fonts.googleapis.com/css2?family=Blaka&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Barra de Navegação -->
    <header class="navbar">
        <div class="menu-icon">
            <span>&#9776;</span>
        </div>
        
        <div class="logo-container">
            <img src="../assets/castle.png" alt="Logo Dragão" class="logo-img">
            <h1 class="logo-text">ODR</h1>
        </div>

        <div class="user-profile">
            <img src="../assets/account.png" alt="Ícone Usuário" class="user-icon">
            <span class="username">suzy</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <h2 class="page-title">MENU PRINCIPAL</h2>

        <div class="cards-container">
            
            <!-- Cartão 1: Personagens -->
            <article class="card">
                <div class="card-icon">
                    <img src="../assets/danger.png" alt="Ícone Personagens">
                </div>
                
                <h3 class="card-title">PERSONAGENS</h3>
                <p class="card-desc">Faça novos heróis, edite seus atributos e organize o inventário.</p>
                
                <button class="card-btn" onclick="window.location.href='personagens.html'">ABRIR FICHAS</button>
            </article>

            <!-- Cartão 2: Campanhas -->
            <article class="card">
                <div class="card-icon">
                    <img src="../assets/castle.png" alt="Ícone Campanhas">
                </div>
                
                <h3 class="card-title">CAMPANHAS</h3>
                <p class="card-desc">Consulte suas campanhas, anotações de missões e seu progresso.</p>
                
                <button class="card-btn">ABRIR CAMPANHAS</button>
            </article>

        </div>
    </main>

    <!-- Logo no canto inferior -->
    <img src="../assets/ODR_2m.png" alt="Logo ODR Lobo" class="watermark-logo">

</body>
</html>
