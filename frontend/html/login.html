<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODR - Login</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Blaka&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <main class="login-container">
        
        <!-- Metade Esquerda: Fundo de papel e Formulário -->
        <section class="login-left">
            <div class="login-box">
                <img src="../assets/ODR3.png" alt="Logo ODR" class="login-logo">
                <h1 class="login-title">
                    <span class="destaque-titulo">B</span>em-vindo ao<br>sistema <span class="destaque-titulo">ODR</span>
                </h1>
                <p class="login-subtitle">Faça login para acessar suas campanhas</p>
                
                <!-- O botão de entrar redireciona pro index.html -->
                <form action="index.html" class="login-form">
                    <div class="input-group">
                        <label for="email">E-MAIL DO JOGADOR</label>
                        <input type="email" id="email" class="ribbon-input" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="senha">SENHA</label>
                        <input type="password" id="senha" class="ribbon-input" required>
                    </div>
                    
                    <button type="submit" class="login-btn">ENTRAR NA TAVERNA</button>
                </form>
                
                <div class="login-links">
                    <a href="#">Esqueci a senha</a> . <a href="#">Criar conta</a>
                </div>
            </div>
        </section>

        <!-- Metade Direita: desenho july -->
        <section class="login-right">
            <!--controlado pelo CSS -->
        </section>

    </main>

</body>
</html>
